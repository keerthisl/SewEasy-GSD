<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SewEasy GSD Software - Professional garment software solutions">
    <title>SewEasy GSD Software</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #3498db;
        }
        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.2rem;
        }
        .tagline {
            color: #666;
            margin-top: 0.5rem;
        }
        .contact-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .contact-item {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .contact-item i {
            width: 20px;
            color: #3498db;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        .social-links a {
            color: #666;
            font-size: 1.5rem;
            transition: color 0.3s;
        }
        .social-links a:hover {
            color: #3498db;
        }
        .fa-facebook:hover { color: #1877f2; }
        .fa-linkedin:hover { color: #0077b5; }
        .fa-youtube:hover { color: #ff0000; }
        .fa-whatsapp:hover { color: #25D366; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <h1>SewEasy GSD</h1>
            <p class="tagline">Professional Garment Software Solutions</p>
        </div>

        <div class="contact-section">
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                394/3, Lily Avenue, Battaramulla, Sri Lanka, 010120
            </div>
            
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                Office: +94[11]7034175
            </div>
            
            <div class="contact-item">
                <i class="fab fa-whatsapp"></i>
                India: +919717914937
            </div>
            
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <a href="mailto:do-not-spam-via-fb-sales@seweasy.biz">do-not-spam-via-fb-sales@seweasy.biz</a>
            </div>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/SewEasy.biz" target="_blank" title="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://www.linkedin.com/company/2974646" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://www.youtube.com/user/seweasydotbiz" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </div>
</body>
</html>
